<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTCF — Núcleo Técnico-Científico Forense</title>
  <meta name="description" content="NTCF Núcleo Técnico-Científico Forense — perícia é ciência, ética é nosso compromisso.">

  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="manifest" href="assets/site.webmanifest">

  <!-- Content Security Policy (CSP) contra injeções de scripts externos -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data:;
    connect-src 'none';
    frame-ancestors 'none';
  ">

  <!-- Referrer Policy restritiva -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======================= HEADER ======================= -->
<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a href="#inicio" class="brand" id="brand-slot"></a>

    <nav class="main-nav" id="main-nav">
      <button class="nav-close" id="nav-close" aria-label="Fechar menu"></button>
      <ul class="nav-links" id="nav-links"></ul>
      <a href="#contato" class="btn btn-gold" id="nav-cta"></a>
    </nav>

    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu"></button>
  </div>
</header>
<div class="nav-scrim" id="nav-scrim"></div>

<!-- ======================= HERO ======================= -->
<section class="hero" id="inicio">
  <div class="container hero-inner">
    <div class="hero-copy">
      <span class="tag hero-eyebrow" id="hero-eyebrow"></span>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-subtitle" id="hero-subtitle"></p>
      <p class="hero-text" id="hero-text"></p>
      <div class="hero-buttons">
        <a href="#contato" class="btn btn-gold" id="hero-cta"></a>
      </div>
    </div>

    <div class="hero-media" data-reveal>
      <div class="crest-scan">
        <div class="brand-crest" id="hero-crest"></div>
      </div>
      <p class="hero-media-name" id="hero-media-name"></p>
      <div class="divider-dot center" style="max-width:120px"></div>
      <p class="hero-media-tag" id="hero-media-tag"></p>
    </div>
  </div>
</section>

<!-- ======================= PERÍCIAS ======================= -->
<section class="pericias" id="pericias">
  <div class="container">
    <div class="section-head" data-reveal>
      <span class="tag section-eyebrow">Especialidades</span>
      <h2 class="section-title" style="margin-top:16px">Tipos de Perícias</h2>
    </div>
    <div class="pericias-grid" id="pericias-grid" data-reveal-group></div>
  </div>
</section>

<!-- ======================= QUEM SOMOS ======================= -->
<section class="quem-somos" id="quem-somos">
  <div class="container quem-somos-inner">
    <div class="quem-somos-media" data-reveal>
      <div class="quem-somos-media-crest">
        <div class="brand-crest" id="sobre-crest"></div>
        <span id="sobre-crest-nome"></span>
      </div>
    </div>

    <div class="quem-somos-text" data-reveal>
      <span class="tag section-eyebrow" id="sobre-eyebrow"></span>
      <h2 class="section-title" style="margin-top:16px; text-align:left" id="sobre-titulo"></h2>
      <div id="sobre-paragrafos"></div>
      <div class="pilares" id="pilares"></div>
    </div>
  </div>
</section>

<!-- ======================= RODAPÉ / CONTATO ======================= -->
<footer class="site-footer" id="contato">
  <div class="container footer-grid">
    <div class="footer-brand">
      <div class="brand" id="footer-brand-slot"></div>
      <p id="footer-slogan"></p>
    </div>

    <div>
      <h3 class="footer-heading">Contatos</h3>
      <ul class="footer-contact" id="footer-contact"></ul>
    </div>

    <div>
      <h3 class="footer-heading">Redes Sociais</h3>
      <div class="social-row" id="social-row"></div>
    </div>
  </div>

  <div class="container footer-bottom" id="footer-bottom"></div>
</footer>

<a class="whatsapp-float" id="whatsapp-btn" href="#" target="_blank" rel="noopener noreferrer" aria-label="Falar no WhatsApp"></a>

<!-- ======================= SCRIPTS ======================= -->
<script src="assets/icons/icons.js"></script>
<script src="data/site-data.js"></script>
<script src="data/pericias.js"></script>
<script src="js/main.js"></script>
</body>
</html>
